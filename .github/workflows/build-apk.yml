name: Build AIONE APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -o AIONE_project.zip -d buildsrc

      - name: Build APK
        working-directory: buildsrc/AIONE_project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mv buildsrc/AIONE_project/app/build/outputs/apk/debug/app-debug.apk \
             buildsrc/AIONE_project/app/build/outputs/apk/debug/AIONE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIONE
          path: buildsrc/AIONE_project/app/build/outputs/apk/debug/AIONE.apk
